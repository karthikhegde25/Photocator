# One-off: regenerates the Gradle wrapper so the jar matches gradle-wrapper.properties (8.10.2).
# Run it once from the Actions tab, then delete this file.
name: Fix Gradle wrapper
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Regenerate wrapper
        run: |
          gradle wrapper --gradle-version 8.10.2 \
            --gradle-distribution-sha256-sum 31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26
          chmod +x gradlew
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git diff --cached --quiet || git commit -m "Align Gradle wrapper jar with 8.10.2"
          git push
